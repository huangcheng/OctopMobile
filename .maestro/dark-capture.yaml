# Dark-mode capture: main surfaces with the sim appearance set to dark.
appId: host.exp.Exponent
---
- stopApp: host.exp.Exponent
- openLink: "exp://localhost:8081"
- waitForAnimationToEnd: { timeout: 15000 }
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd: { timeout: 10000 }
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 90000
- takeScreenshot: "dk-login"
- tapOn:
    id: "login-base-url"
- inputText: "http://192.168.31.200:9000"
- tapOn:
    id: "login-username"
- inputText: "smoke-e2e"
- tapOn:
    id: "login-password"
- inputText: "Smoke-1234!"
- hideKeyboard
- tapOn: "Sign in"
- runFlow:
    when:
      visible: "Use cleartext HTTP?"
    commands:
      - tapOn: "Continue once"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 45000
- takeScreenshot: "dk-chats"

- tapOn: "Knowledge"
- extendedWaitUntil:
    visible: "MY BASES"
    timeout: 30000
- takeScreenshot: "dk-knowledge"

- tapOn: "个人"
- extendedWaitUntil:
    visible: "DOCUMENTS"
    timeout: 30000
- takeScreenshot: "dk-kb-detail"

- tapOn: "cessss.md"
- extendedWaitUntil:
    visible: "分享 Markdown"
    timeout: 30000
- takeScreenshot: "dk-reader"

- back
- extendedWaitUntil:
    visible: "DOCUMENTS"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "MY BASES"
    timeout: 15000
- tapOn: "Experts"
- extendedWaitUntil:
    visible: "Smoke Tester"
    timeout: 30000
- takeScreenshot: "dk-experts"

- tapOn: "Smoke Tester"
- extendedWaitUntil:
    visible: "Start chat"
    timeout: 30000
- takeScreenshot: "dk-expert-detail"

- tapOn: "Start chat"
- extendedWaitUntil:
    visible: "Send"
    timeout: 30000
- takeScreenshot: "dk-new-chat"

- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 30000
- takeScreenshot: "dk-settings"
