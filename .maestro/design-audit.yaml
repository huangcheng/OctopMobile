# Design-constitution audit: cold-starts the app and screenshots every main screen.
# Compare captures against docs/design/screens/*.png (Ardot is the source of truth).
# Requires: Metro on :8081 (`npx expo start`), iOS Simulator booted, app logged in.
# NOTE: each segment stopApp+openLink cold-starts (Expo Go resumes the last route,
# and pushed screens like New Chat have no tab bar), so avoid relying on `back`.
appId: host.exp.Exponent
---
# 03 Conversation + 17 New chat
- stopApp: host.exp.Exponent
- openLink: "exp://localhost:8081"
- waitForAnimationToEnd: { timeout: 40000 }
- tapOn: "对话"
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: "03-chats"
- tapOn: "新对话"
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: "17-new-chat"

